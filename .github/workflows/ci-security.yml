name: CI-Security-Lab

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]
    paths:
      - "terraform/**"
      - ".github/workflows/ci-security.yml"

permissions:
  actions: read
  contents: read
  security-events: write
  pull-requests: write

concurrency:
  group: ci-security-devsec
  cancel-in-progress: true

env:
  TF_WORKING_DIR: terraform
  TF_VERSION: 1.9.8
  TF_IN_AUTOMATION: "true"

jobs:
  security:
    runs-on: ubuntu-latest
    environment: devsec
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Prepare SARIF output directory
        run: mkdir -p .reports

      - name: Detect GitHub code scanning availability
        id: code_scanning
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          status="$(curl -sS -o "$RUNNER_TEMP/code-scanning.json" -w "%{http_code}" \
            -H "Authorization: Bearer ${GITHUB_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "${{ github.api_url }}/repos/${{ github.repository }}/code-scanning/alerts?per_page=1")"

          if [ "$status" = "200" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
            echo "GitHub code scanning is available for this run."
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "GitHub code scanning upload will be skipped for this run (HTTP $status)."
            cat "$RUNNER_TEMP/code-scanning.json" || true
          fi

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Terraform fmt check
        run: terraform -chdir=${{ env.TF_WORKING_DIR }} fmt -check -recursive

      - name: Terraform validate
        run: |
          terraform -chdir=${{ env.TF_WORKING_DIR }} init -backend=false -input=false
          terraform -chdir=${{ env.TF_WORKING_DIR }} validate

      - name: Configure AWS Credentials for Plan
        uses: aws-actions/configure-aws-credentials@v4
        with:
         aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
         aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
         aws-region: us-east-1

      - name: Terraform Init (with Backend)
        run: terraform -chdir=${{ env.TF_WORKING_DIR }} init -reconfigure -input=false

      - name: Terraform Plan (Security Scan)
        id: tf-plan
        run: |
          terraform -chdir=${{ env.TF_WORKING_DIR }} plan -input=false -no-color > tfplan.txt 2>&1 || true
          echo "=== TERRAFORM PLAN ===" >&2
          cat tfplan.txt >&2

      - name: Post Terraform Plan to PR Comment
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            const plan = fs.readFileSync('tfplan.txt', 'utf8');
             
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `## 🔧 Terraform Plan\n\n\`\`\`terraform\n${plan}\n\`\`\``
            });

      - name: tfsec scan
        uses: aquasecurity/tfsec-action@v1.0.3
        with:
          working_directory: terraform
          format: sarif
          soft_fail: true
          additional_args: --out .reports/tfsec
          version: v1.28.13
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Checkov scan
        uses: bridgecrewio/checkov-action@v12
        with:
          directory: terraform
          soft_fail: true
          output_format: cli,sarif
          output_file_path: console,.reports/checkov.sarif

      - name: Trivy fs scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          format: sarif
          output: .reports/trivy-results.sarif
          exit-code: "0"
          ignore-unfixed: true
          severity: CRITICAL,HIGH

      - name: Set up Python for Semgrep
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install Semgrep CLI
        run: python -m pip install --upgrade pip semgrep

      - name: Semgrep scan
        run: semgrep scan --config .semgrep.yml --sarif --output .reports/semgrep.sarif .
        continue-on-error: true

      - name: Normalize SARIF outputs
        if: always()
        id: sarif_files
        run: |
          set -euo pipefail

          normalize_file() {
            dest="$1"
            shift

            for candidate in "$@"; do
              if [ -f "$candidate" ]; then
                if [ "$candidate" != "$dest" ]; then
                  cp "$candidate" "$dest"
                fi
                return 0
              fi
            done

            return 1
          }

          tfsec_found=false
          if normalize_file ".reports/tfsec.sarif" \
            ".reports/tfsec.sarif" \
            ".reports/tfsec.sarif.sarif" \
            "terraform/.reports/tfsec.sarif" \
            "terraform/.reports/tfsec.sarif.sarif" \
            "tfsec.sarif" \
            "terraform/tfsec.sarif"; then
            tfsec_found=true
          fi

          checkov_found=false
          if normalize_file ".reports/checkov.sarif" \
            ".reports/checkov.sarif" \
            "results.sarif" \
            "terraform/results.sarif"; then
            checkov_found=true
          fi

          trivy_found=false
          if normalize_file ".reports/trivy-results.sarif" \
            ".reports/trivy-results.sarif" \
            "trivy-results.sarif"; then
            trivy_found=true
          fi

          semgrep_found=false
          if normalize_file ".reports/semgrep.sarif" \
            ".reports/semgrep.sarif" \
            "semgrep.sarif"; then
            semgrep_found=true
          fi

          echo "tfsec=${tfsec_found}" >> "$GITHUB_OUTPUT"
          echo "checkov=${checkov_found}" >> "$GITHUB_OUTPUT"
          echo "trivy=${trivy_found}" >> "$GITHUB_OUTPUT"
          echo "semgrep=${semgrep_found}" >> "$GITHUB_OUTPUT"

      - name: Upload tfsec results to GitHub Security
        if: always() && steps.code_scanning.outputs.enabled == 'true' && steps.sarif_files.outputs.tfsec == 'true'
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: .reports/tfsec.sarif
          category: tfsec

      - name: Upload Checkov results to GitHub Security
        if: always() && steps.code_scanning.outputs.enabled == 'true' && steps.sarif_files.outputs.checkov == 'true'
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: .reports/checkov.sarif
          category: checkov

      - name: Upload Trivy results to GitHub Security
        if: always() && steps.code_scanning.outputs.enabled == 'true' && steps.sarif_files.outputs.trivy == 'true'
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: .reports/trivy-results.sarif
          category: trivy

      - name: Upload Semgrep results to GitHub Security
        if: always() && steps.code_scanning.outputs.enabled == 'true' && steps.sarif_files.outputs.semgrep == 'true'
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: .reports/semgrep.sarif
          category: semgrep

      - name: Upload SARIF reports as workflow artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-sarif-reports
          path: .reports/
          if-no-files-found: warn

      - name: Optional DAST precheck (secret + network reachability)
        id: dast_precheck
        run: |
          set -euo pipefail

          if [ -z "${{ secrets.DAST_TARGET_URL }}" ]; then
            echo "run_dast=false" >> "$GITHUB_OUTPUT"
            echo "DAST_TARGET_URL is not set. Skipping DAST."
            exit 0
          fi

          url="${{ secrets.DAST_TARGET_URL }}"
          host="$(echo "$url" | sed -E 's#https?://([^/:]+).*#\1#')"
          port="$(echo "$url" | sed -nE 's#https?://[^/:]+:([0-9]+).*#\1#p')"

          if [ -z "${port}" ]; then
            if echo "$url" | grep -q '^https://'; then
              port=443
            else
              port=80
            fi
          fi

          if nc -z -w 5 "$host" "$port"; then
            echo "run_dast=true" >> "$GITHUB_OUTPUT"
            echo "Target reachable at $host:$port"
          else
            echo "run_dast=false" >> "$GITHUB_OUTPUT"
            echo "Target not reachable at $host:$port. Skipping DAST."
          fi

      - name: ZAP Baseline
        if: steps.dast_precheck.outputs.run_dast == 'true'
        continue-on-error: true
        uses: zaproxy/action-baseline@v0.12.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          target: ${{ secrets.DAST_TARGET_URL }}
          fail_action: false
          artifact_name: zap-report