name: CI-Security-Lab

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]
    paths:
      - "terraform/**"
      - ".github/workflows/ci-security.yml"

permissions:
  contents: read
  security-events: write

concurrency:
  group: ci-security-devsec
  cancel-in-progress: true

env:
  TF_WORKING_DIR: terraform
  TF_VERSION: 1.9.8
  TF_IN_AUTOMATION: "true"

jobs:
  security:
    runs-on: ubuntu-latest
    environment: devsec
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Terraform fmt check
        run: terraform -chdir=${{ env.TF_WORKING_DIR }} fmt -check -recursive

      - name: Terraform validate (no backend)
        run: |
          terraform -chdir=${{ env.TF_WORKING_DIR }} init -backend=false -input=false
          terraform -chdir=${{ env.TF_WORKING_DIR }} validate

      - name: tfsec scan
        uses: aquasecurity/tfsec-action@v1.0.3
        with:
          working_directory: terraform
          additional_args: --soft-fail

      - name: Checkov scan
        uses: bridgecrewio/checkov-action@v12
        with:
          directory: terraform
          soft_fail: true

      - name: Trivy fs scan
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: fs
          scan-ref: .
          format: table
          exit-code: "0"

      - name: Optional DAST precheck
        id: dast_precheck
        run: |
          if [ -z "${{ secrets.DAST_TARGET_URL }}" ]; then
            echo "run_dast=false" >> "$GITHUB_OUTPUT"
          else
            echo "run_dast=true" >> "$GITHUB_OUTPUT"
          fi

      - name: ZAP Baseline
        if: steps.dast_precheck.outputs.run_dast == 'true'
        uses: zaproxy/action-baseline@v0.12.0
        with:
          target: ${{ secrets.DAST_TARGET_URL }}
          fail_action: false