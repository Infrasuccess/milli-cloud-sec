name: CI-Security-Lab

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]
    paths:
      - "terraform/**"
      - ".github/workflows/ci-security.yml"

permissions:
  actions: read
  contents: read
  security-events: write

concurrency:
  group: ci-security-devsec
  cancel-in-progress: true

env:
  TF_WORKING_DIR: terraform
  TF_VERSION: 1.9.8
  TF_IN_AUTOMATION: "true"

jobs:
  security:
    runs-on: ubuntu-latest
    environment: devsec
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Terraform fmt check
        run: terraform -chdir=${{ env.TF_WORKING_DIR }} fmt -check -recursive

      - name: Terraform validate
        run: |
          terraform -chdir=${{ env.TF_WORKING_DIR }} init -backend=false -input=false
          terraform -chdir=${{ env.TF_WORKING_DIR }} validate

      - name: tfsec scan
        uses: aquasecurity/tfsec-action@v1.0.3
        with:
          working_directory: terraform
          format: sarif
          soft_fail: true
          additional_args: --out tfsec.sarif
          version: v1.28.13
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload tfsec results to GitHub Security
        if: always()
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: terraform/tfsec.sarif
          category: tfsec

      - name: Checkov scan
        uses: bridgecrewio/checkov-action@v12
        with:
          directory: terraform
          soft_fail: true
          output_format: cli,sarif
          output_file_path: console,results.sarif

      - name: Upload Checkov results to GitHub Security
        if: always()
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: results.sarif
          category: checkov

      - name: Trivy fs scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          format: sarif
          output: trivy-results.sarif
          exit-code: "0"
          ignore-unfixed: true
          severity: CRITICAL,HIGH

      - name: Upload Trivy results to GitHub Security
        if: always()
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-results.sarif
          category: trivy

      - name: Set up Python for Semgrep
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install Semgrep CLI
        run: python -m pip install --upgrade pip semgrep

      - name: Semgrep scan
        run: semgrep scan --config .semgrep.yml --sarif --output semgrep.sarif .
        continue-on-error: true

      - name: Upload Semgrep results to GitHub Security
        if: always()
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: semgrep.sarif
          category: semgrep

      - name: Optional DAST precheck (secret + network reachability)
        id: dast_precheck
        run: |
          set -euo pipefail

          if [ -z "${{ secrets.DAST_TARGET_URL }}" ]; then
            echo "run_dast=false" >> "$GITHUB_OUTPUT"
            echo "DAST_TARGET_URL is not set. Skipping DAST."
            exit 0
          fi

          url="${{ secrets.DAST_TARGET_URL }}"
          host="$(echo "$url" | sed -E 's#https?://([^/:]+).*#\1#')"
          port="$(echo "$url" | sed -nE 's#https?://[^/:]+:([0-9]+).*#\1#p')"

          if [ -z "${port}" ]; then
            if echo "$url" | grep -q '^https://'; then
              port=443
            else
              port=80
            fi
          fi

          if nc -z -w 5 "$host" "$port"; then
            echo "run_dast=true" >> "$GITHUB_OUTPUT"
            echo "Target reachable at $host:$port"
          else
            echo "run_dast=false" >> "$GITHUB_OUTPUT"
            echo "Target not reachable at $host:$port. Skipping DAST."
          fi

      - name: ZAP Baseline
        if: steps.dast_precheck.outputs.run_dast == 'true'
        continue-on-error: true
        uses: zaproxy/action-baseline@v0.12.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          target: ${{ secrets.DAST_TARGET_URL }}
          fail_action: false
          artifact_name: zap-report