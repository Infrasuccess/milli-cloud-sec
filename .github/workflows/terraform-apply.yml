name: Terraform-Apply-Lab

on:
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: terraform-devsec-apply
  cancel-in-progress: false

env:
  TF_WORKING_DIR: terraform
  AWS_REGION: us-east-1
  TF_VERSION: 1.9.8
  TF_IN_AUTOMATION: "true"

jobs:
  apply:
    runs-on: ubuntu-latest
    environment: devsec
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Preflight secret check
        run: |
          set -euo pipefail
          test -n "${{ secrets.AWS_ACCESS_KEY_ID }}" || (echo "Missing AWS_ACCESS_KEY_ID" && exit 1)
          test -n "${{ secrets.AWS_SECRET_ACCESS_KEY }}" || (echo "Missing AWS_SECRET_ACCESS_KEY" && exit 1)
          test -n "${{ secrets.BUDGET_EMAIL }}" || (echo "Missing BUDGET_EMAIL" && exit 1)

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: AWS identity check
        run: aws sts get-caller-identity

      - name: Backend existence check
        run: |
          set -euo pipefail
          aws s3api head-bucket --bucket "milli-cloud-sec-tf-state-419467346711"
          aws dynamodb describe-table \
            --table-name "milli-cloud-sec-tf-locks" \
            --region "${AWS_REGION}" \
            --query "Table.TableStatus" \
            --output text

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Terraform Fmt Check
        run: terraform -chdir=${{ env.TF_WORKING_DIR }} fmt -check -recursive

      - name: Terraform Init
        run: terraform -chdir=${{ env.TF_WORKING_DIR }} init -reconfigure -input=false

      - name: Terraform Validate
        run: terraform -chdir=${{ env.TF_WORKING_DIR }} validate

      - name: Terraform Plan
        run: |
          terraform -chdir=${{ env.TF_WORKING_DIR }} plan \
            -input=false \
            -out=tfplan \
            -var="notification_email=${{ secrets.BUDGET_EMAIL }}"
        id: tf-plan

      - name: Terraform Plan Output
        run: |
          terraform -chdir=${{ env.TF_WORKING_DIR }} show -no-color tfplan | tee tfplan.txt
          echo "=== TERRAFORM PLAN OUTPUT ===" >&2
          cat tfplan.txt >&2

      - name: Post Plan to PR Comment
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            const plan = fs.readFileSync('${{ env.TF_WORKING_DIR }}/tfplan.txt', 'utf8');
             
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `## 📋 Terraform Plan\n\`\`\`terraform\n${plan}\n\`\`\``
            });

      - name: Terraform Apply
        run: terraform -chdir=${{ env.TF_WORKING_DIR }} apply -input=false -auto-approve tfplan

      - name: Terraform Output
        run: terraform -chdir=${{ env.TF_WORKING_DIR }} output