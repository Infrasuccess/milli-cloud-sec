name: Terraform-Apply-Lab

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  TF_WORKING_DIR: terraform

jobs:
  apply:
    runs-on: ubuntu-latest
    environment: devsec
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Preflight secret check
        run: |
          test -n "${{ secrets.AWS_ACCESS_KEY_ID }}" || (echo "Missing AWS_ACCESS_KEY_ID" && exit 1)
          test -n "${{ secrets.AWS_SECRET_ACCESS_KEY }}" || (echo "Missing AWS_SECRET_ACCESS_KEY" && exit 1)
          test -n "${{ secrets.BUDGET_EMAIL }}" || (echo "Missing BUDGET_EMAIL" && exit 1)

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Install Terraform CLI (non-interactive)
        run: |
          set -euo pipefail
          TF_VERSION=1.9.8
          wget -q "https://releases.hashicorp.com/terraform/${TF_VERSION}/terraform_${TF_VERSION}_linux_amd64.zip" -O /tmp/terraform.zip
          rm -f /tmp/terraform
          unzip -o /tmp/terraform.zip -d /tmp
          sudo install -m 0755 /tmp/terraform /usr/local/bin/terraform
          terraform version

      - name: Terraform Init
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform init

      - name: Terraform Plan
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform plan -var="notification_email=${{ secrets.BUDGET_EMAIL }}"

      - name: Terraform Apply
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform apply -auto-approve -var="notification_email=${{ secrets.BUDGET_EMAIL }}"