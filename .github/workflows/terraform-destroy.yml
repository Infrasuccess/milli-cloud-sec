name: Terraform-Destroy-Lab

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type DESTROY to confirm'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: terraform-devsec-destroy
  cancel-in-progress: false

env:
  TF_WORKING_DIR: terraform
  AWS_REGION: us-east-1
  TF_VERSION: 1.9.8
  TF_IN_AUTOMATION: "true"

jobs:
  destroy:
    if: ${{ github.event.inputs.confirm == 'DESTROY' }}
    runs-on: ubuntu-latest
    environment: devsec
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Preflight secret check
        run: |
          set -euo pipefail
          test -n "${{ secrets.AWS_ACCESS_KEY_ID }}" || (echo "Missing AWS_ACCESS_KEY_ID" && exit 1)
          test -n "${{ secrets.AWS_SECRET_ACCESS_KEY }}" || (echo "Missing AWS_SECRET_ACCESS_KEY" && exit 1)
          test -n "${{ secrets.BUDGET_EMAIL }}" || (echo "Missing BUDGET_EMAIL" && exit 1)

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Terraform Init
        run: terraform -chdir=${{ env.TF_WORKING_DIR }} init -reconfigure -input=false

      - name: Terraform Destroy
        run: terraform -chdir=${{ env.TF_WORKING_DIR }} destroy -input=false -auto-approve -var="notification_email=${{ secrets.BUDGET_EMAIL }}"